# MongoDB cục bộ cho phát triển; chỉ mở cổng trên máy này.
name: restaurant-qr

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
